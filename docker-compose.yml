services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./tasks.db:/app/tasks.db
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-change-me}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
